[project]
name = "retail-anomaly-detection"
version = "0.1.0"
description = "Deteksi anomali transaksi penjualan retail berbasis rule R1-R6 untuk internal audit"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
